purchase_order:
  - key: Purchase Order

    query_template:
      - "What is the {field} on purchase order {filename}?"

    fields:
      - po_number
      - vendor
      - amount
      - delivery_date

    tags:
      - retrieval
      - erp
      - metadata

invoice:
  - key: Invoice
    query_template:
      - "What is the {field} on invoice {filename}?"
    fields:
      - invoice_number
      - amount
      - customer
      - currency
      - due_date
    tags:
      - retrieval
      - erp
      - metadata

  - key: Invoice Amount
    query_template:
        - "What is the invoice amount in {filename}?"
    fields:
        - invoice_number
        - amount
        - customer
        - currency
        - due_date
    tags:
      - retrieval
      - erp
      - metadata

  - key: Invoice Currency
    query_template:
        - "Which currency is used in {filename}?"
    fields:
        - invoice_number
        - amount
        - customer
        - currency
        - due_date
    tags:
      - retrieval
      - erp
      - metadata
  - key: Invoice Supplier
    query_template:
        - "Who issued {filename}?"
    fields:
        - invoice_number
        - amount
        - customer
        - currency
        - due_date
    tags:
      - retrieval
      - erp
      - metadata
  - key: Invoice Customer
    query_template:
        - "Who is the customer on {filename}?"
    fields:
        - invoice_number
        - amount
        - customer
        - currency
        - due_date
    tags:
      - retrieval
      - erp
      - metadata

contract:
  - key: Contract
    query_template:
      - "What is the {field} in contract {filename}?"
    fields:
      - contract_number
      - customer
      - contractor
      - start_date
      - end_date
    tags:
      - retrieval
      - erp
      - metadata

vendor_profile:
  - key: Vendor Profile
    query_template:
      - "What is the {field} of the vendor in {filename}?"
    fields:
      - name: vendor
        aliases:
          - vendor name

      - name: vendor_id
        aliases:
          - vendor ID

      - name: phone
        aliases:
          - phone
          - telephone
          - tel

      - name: email
        aliases:
          - email
          - e-mail

      - name: address
        aliases:
          - address
    tags:
      - retrieval
      - erp
      - metadata

service_ticket:
  - key: Service Ticket
    query_template:
      - "What is the {field} for service ticket {filename}?"
    fields:
      - ticket_number
      - status
      - engineer
      - priority
    tags:
      - retrieval
      - erp
      - metadata

crm_opportunity:
  - key: CRM Opportunity
    query_template:
      - "What is the {field} of the opportunity in {filename}?"
    fields:
      - opportunity_name
      - stage
      - value
    tags:
      - retrieval
      - erp
      - metadata

project:
  - key: Project
    query_template:
      - "What is the {field} of the project described in {filename}?"
    fields:
      - project_name
      - status
      - manager
    tags:
      - retrieval
      - erp
      - metadata

employee:
  - key: Employee
    query_template:
      - "What is the {field} for the employee record in {filename}?"
    fields:
      - employee_id
      - department
      - hire_date
    tags:
      - retrieval
      - erp
      - metadata



