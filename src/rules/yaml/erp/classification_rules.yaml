purchase_order:
  filename_patterns:
    - "purchase[-_ ]?order"
    - "\\bpo[-_]?\\d+"
    - '\bPO-\d+(?:-\d+)*\b'

  content_patterns:
    - "purchase\\s*order"
    - "\\bp\\.?o\\.?\\s*(no|number|#)"
    - '\bpurchase\s*order\b'
    - '\bpo-\d+'
    - '\bp\.?o\.?\s*(no|number|#)'
    - '\bpo[-_]?\d+'

invoice:
  filename_patterns:
    - 'INV-\d+'
    - 'invoice'
    - "\\binv[-_]?\\d+"

  content_patterns:
    - '\binvoice\b'
    - 'invoice\s*(no|number|#)'
    - 'invoice\s*number'
    - 'total\s*due'
    - 'bill\s*to'
    - '\bINV-\d+(?:-\d+)*\b'


contract:
  filename_patterns:
    - contract
    - agreement
    - msa

  content_patterns:
    - '\bagreement\b'
    - 'service\s*agreement'
    - 'contract\s*number'
    - 'договір'
    - 'this\s*agreement'
    - '\bcontract\b'
    - '\bC-\d+\b'

vendor_profile:
  filename_patterns:
    - 'vendor'
    - 'supplier'

  content_patterns:
    - 'vendor\s*(name|profile|id)'
    - 'supplier\s*information'

service_ticket:
  filename_patterns:
    - 'ticket'
    - "service[-_ ]?request"

  content_patterns:
    - 'ticket\s*(no|number|#)'
    - 'assigned\s*engineer'
    - 'priority\s*:'

crm_opportunity:
  filename_patterns:
    - "opportunity"
    - '\bcrm\b'
    - "deal"

  content_patterns:
    - 'opportunity\s*(name|stage|value)'
    - 'deal\s*stage'

project:
  filename_patterns:
    - "project"

  content_patterns:
    - 'project\s*(status|milestones|deliverables)'

employee:
  filename_patterns:
    - "employee"
    - "hr[-_ ]?record"

  content_patterns:
    - 'employee\s*id'
    - 'department\s*:'
    - 'hire\s*date'
